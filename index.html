<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="app-container">
  <!-- Header / Title -->
  <header class="app-header">
    <h1>Budget Tracker</h1>
  </header>

  <!-- Summary Cards Section -->
  <section class="summary-container">
    <article class="card income-card">
      <span class="card-title">Total Income</span>
      <p class="card-amount">$0.00</p>
    </article>

    <article class="card expense-card">
      <span class="card-title">Total Expense</span>
      <p class="card-amount">$0.00</p>
    </article>

    <article class="card balance-card">
      <span class="card-title">Balance</span>
      <p class="card-amount">$0.00</p>
    </article>
  </section>

  <!-- Transaction Form Section -->
  <section class="form-section">
    <h2>Add New Transaction</h2>
    <form class="transaction-form">
      <div class="form-group">
        <label for="description">Description</label>
        <input 
          type="text" 
          id="description" 
          placeholder="e.g. Grocery Shopping" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="amount">Amount</label>
        <input 
          type="number" 
          id="amount" 
          placeholder="0.00" 
          step="0.01" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="type">Type</label>
        <select id="type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Add Transaction</button>
    </form>
  </section>

  <!-- Transaction List Section -->
  <section class="list-section">
    <h2>Transaction History</h2>
    <ul class="transaction-list">
      <!-- Dummy Items for Sprint 1 -->
      <li class="transaction-item income">
        <span class="item-description">Salary</span>
        <span class="item-amount">+$2,500.00</span>
      </li>
      <li class="transaction-item expense">
        <span class="item-description">Grocery Shopping</span>
        <span class="item-amount">-$450.00</span>
      </li>
    </ul>
  </section>
</main>
    
</body>
</html>
